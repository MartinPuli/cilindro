<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a1a2f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>El Cilindro · Racing Club — Visor 3D</title>
    <meta
      name="description"
      content="Recorré El Cilindro de Racing Club en 3D. Elegí tu sector y tu butaca y mirá cómo se ve la cancha desde tu lugar."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%2370c5e8'/%3E%3Cstop offset='1' stop-color='%231e88c7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='30' fill='url(%23g)' stroke='white' stroke-width='4'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-size='26' font-weight='bold' fill='white' text-anchor='middle'%3ERC%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <script type="module" crossorigin src="./assets/index-DARlNacU.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BLO072eF.css">
  </head>
  <body>
    <canvas id="scene"></canvas>

    <!-- Loading -->
    <div id="loader">
      <div class="loader-crest"><div class="crest">RC</div></div>
      <div class="loader-title">EL CILINDRO</div>
      <div class="loader-sub">Estadio Presidente Perón · Avellaneda</div>
      <div class="loader-bar"><div class="loader-bar-fill" id="loader-fill"></div></div>
      <div class="loader-pct" id="loader-pct">Cargando el estadio… 0%</div>
    </div>

    <!-- Top bar -->
    <header id="topbar" class="ui hidden-on-load">
      <div class="brand">
        <div class="crest crest-sm">RC</div>
        <div class="brand-text">
          <div class="brand-title">EL CILINDRO</div>
          <div class="brand-sub">Racing Club · 3D</div>
        </div>
      </div>
      <div class="top-actions">
        <button class="btn btn-icon" id="btn-rotate" title="Girar solo" aria-label="Girar automáticamente">
          <span class="ico">360°</span>
        </button>
        <button class="btn btn-icon" id="btn-daynight" title="Día / Noche" aria-label="Día o noche">
          <span class="ico" id="daynight-ico">☀</span>
        </button>
      </div>
    </header>

    <!-- Floating back button (area/seat modes) -->
    <button id="backbtn" class="ui hidden">← <span id="backbtn-text">Volver</span></button>

    <!-- Mode tag -->
    <div id="mode-tag" class="ui hidden-on-load">Vista aérea</div>

    <!-- Bottom sheet: content is swapped per mode from main.js -->
    <div id="sheet" class="ui hidden-on-load">
      <div id="sheet-handle"></div>
      <div id="sheet-content"></div>
    </div>

  </body>
</html>
