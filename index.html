  <body>
    <canvas id="scene"></canvas>

    <!-- Loading -->

      <div class="loader-title">EL CILINDRO</div>
      <div class="loader-sub">Estadio Presidente Perón · Avellaneda</div>
      <div class="loader-bar"><div class="loader-bar-fill" id="loader-fill"></div></div>
      <div class="loader-pct" id="loader-pct">Cargando el estadio… 0%</div>
    </div>

    <!-- Top bar -->
    <header id="topbar" class="ui hidden-on-load">
      <div class="brand">
        <img class="crest crest-sm" alt="Racing Club" src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20120%22%3E%3Cdefs%3E%3CclipPath%20id%3D%22s%22%3E%3Cpath%20d%3D%22M10%208H90V72Q90%2092%2050%20113Q10%2092%2010%2072Z%22%2F%3E%3C%2FclipPath%3E%3C%2Fdefs%3E%3Cpath%20d%3D%22M10%208H90V72Q90%2092%2050%20113Q10%2092%2010%2072Z%22%20fill%3D%22%2329a9e1%22%20stroke%3D%22%23fff%22%20stroke-width%3D%224%22%2F%3E%3Cg%20clip-path%3D%22url(%23s)%22%3E%3Crect%20x%3D%2225%22%20y%3D%2236%22%20width%3D%2210%22%20height%3D%2272%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2245%22%20y%3D%2236%22%20width%3D%2210%22%20height%3D%2272%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2265%22%20y%3D%2236%22%20width%3D%2210%22%20height%3D%2272%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22100%22%20height%3D%2233%22%20fill%3D%22%2329a9e1%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2233%22%20width%3D%22100%22%20height%3D%223%22%20fill%3D%22%23fff%22%2F%3E%3C%2Fg%3E%3Ctext%20x%3D%2250%22%20y%3D%2226%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22900%22%20font-size%3D%2218%22%20fill%3D%22%23fff%22%20text-anchor%3D%22middle%22%3ERACING%3C%2Ftext%3E%3C%2Fsvg%3E" />
        <div class="brand-text">
          <div class="brand-title">EL CILINDRO</div>
          <div class="brand-sub">Racing Club · 3D</div>
        </div>
      </div>
      <div class="top-actions">
        <button class="btn btn-icon" id="btn-rotate" title="Girar solo" aria-label="Girar automáticamente">
          <span class="ico">360°</span>
        </button>
        <button class="btn btn-icon" id="btn-daynight" title="Día / Noche" aria-label="Día o noche">
          <span class="ico" id="daynight-ico">☀</span>
        </button>
      </div>
    </header>

    <!-- Floating back button (area/seat modes) -->
    <button id="backbtn" class="ui hidden">← <span id="backbtn-text">Volver</span></button>

    <!-- Mode tag -->
    <div id="mode-tag" class="ui hidden-on-load">Vista aérea</div>

    <!-- Bottom sheet: content is swapped per mode from main.js -->
    <div id="sheet" class="ui hidden-on-load">
      <div id="sheet-handle"></div>
      <div id="sheet-content"></div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
